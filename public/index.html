<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Octavia - Rhythm Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <div id="menuContainer" class="min-vh-100 d-flex flex-column justify-content-center align-items-center" style="background: #1a1a1a;">
        <div class="container text-center">
            <h1 class="display-1 fw-bold text-white mb-2" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">OCTAVIA</h1>
            <div class="row justify-content-center mb-5">
                <div class="col-md-6">
                    <div class="card bg-dark border-light">
                        <div class="card-body p-4">
                            
                            <button class="btn btn-success btn-lg w-100" id="playBtn" style="font-size: 1.2rem; font-weight: bold;">
                                 PLAY
                            </button>
                            <button class="btn btn-info btn-lg w-100 mt-3" id="multiplayerBtn" style="font-size: 1.2rem; font-weight: bold;">
                                 MULTIPLAYER
                            </button>
                            <button class="btn btn-secondary btn-lg w-100 mt-3" id="settingsBtn" style="font-size: 1.2rem; font-weight: bold;">
                                 SETTINGS
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="multiplayerMenuContainer" class="min-vh-100 d-flex flex-column justify-content-center align-items-center d-none" style="background: #1a1a1a;">
        <div class="container text-center">
            <h1 class="display-3 fw-bold text-white mb-4" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">Multiplayer</h1>
            <div class="row justify-content-center mb-5">
                <div class="col-md-6">
                    <div class="card bg-dark border-light">
                        <div class="card-body p-4">
                            <h5 class="text-white mb-3">Create or Join a Room</h5>
                            
                            <div class="mb-3">
                                <input type="text" id="roomCodeInput" class="form-control bg-secondary text-white" placeholder="Enter room code (optional)" style="border-color: #666;">
                            </div>

                            <div id="roomStatusMessage" class="alert alert-info d-none" role="alert" style="font-size: 0.9rem;">
                                Status message here
                            </div>

                            <button class="btn btn-primary btn-lg w-100 mb-2" id="joinRoomBtn" style="font-size: 1rem; font-weight: bold;">
                                JOIN ROOM
                            </button>
                            <button class="btn btn-success btn-lg w-100 mb-2" id="createRoomBtn" style="font-size: 1rem; font-weight: bold;">
                                CREATE NEW ROOM
                            </button>
                            <button class="btn btn-warning btn-lg w-100 mb-2 d-none" id="startGameBtn" style="font-size: 1rem; font-weight: bold;">
                                START GAME
                            </button>
                            <button class="btn btn-danger btn-lg w-100 d-none" id="leaveRoomBtn" style="font-size: 1rem; font-weight: bold;">
                                LEAVE ROOM
                            </button>

                            <hr class="text-secondary my-3">
                            
                            <div id="roomInfoContainer" class="d-none text-white mb-3">
                                <p class="mb-2">
                                    <small>Current Room:</small><br>
                                    <strong id="roomCodeDisplay" style="color: #00ffff; font-family: monospace; font-size: 1.1rem;">---</strong>
                                </p>
                                <p class="mb-2">
                                    <small>Players Connected:</small><br>
                                    <strong id="playerCountDisplay">0</strong>
                                </p>
                            </div>

                            <button class="btn btn-secondary btn-sm w-100" id="backToMainBtn">
                                Back to Main Menu
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="gameContainer" class="d-none">
        <canvas id="gameCanvas" width="950" height="600"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js" type="module"></script>
</body>
</html>
