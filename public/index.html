<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Octavia - Rhythm Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="menuContainer" class="min-vh-100 d-flex flex-column justify-content-center align-items-center" style="background: #1a1a1a;">
        <div class="container text-center">
            <h1 class="display-1 fw-bold text-white mb-2" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">OCTAVIA</h1>
            <div class="row justify-content-center mb-5">
                <div class="col-md-6">
                    <div class="card bg-dark border-light">
                        <div class="card-body p-4">
                            
                            <button class="btn btn-success btn-lg w-100" id="playBtn" style="font-size: 1.2rem; font-weight: bold;">
                                 PLAY
                            </button>
                            <button class="btn btn-secondary btn-lg w-100 mt-3" id="settingsBtn" style="font-size: 1.2rem; font-weight: bold;">
                                 SETTINGS
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="gameContainer" class="d-none">
        <canvas id="gameCanvas" width="950" height="600"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js" type="module"></script>
</body>
</html>
